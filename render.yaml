services:
  - type: web
    name: pulsenet-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    # Uncomment the disk section below if you want persistent database storage (requires paid Render tier)
    # disk:
    #   name: pulsenet-db-disk
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: PULSENET_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PULSENET_DB_PATH
        value: /data/pulsenet.db  # Use persistent path if disk is enabled, otherwise defaults to local DB

